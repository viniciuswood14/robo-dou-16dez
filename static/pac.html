<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard PAC - CORM</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  
  <script src="chart.js"></script>
  
  <style>
    /* Estilos específicos para a tabela do PAC */
    .table-container {
      width: 100%;
      overflow-x: auto; /* Permite rolagem horizontal em telas pequenas */
      margin-top: 24px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }
    .pac-table {
      width: 100%;
      min-width: 1100px; /* Aumentado para caber as novas colunas sem quebrar */
      border-collapse: collapse;
    }
    .pac-table th, .pac-table td {
      padding: 10px 8px; /* Reduzi levemente o padding lateral */
      text-align: right; /* Padrão: alinhado à direita (números) */
      border-bottom: 1px solid var(--border-color);
    }
    
    /* Colunas de Texto alinhadas à esquerda */
    .pac-table th:nth-child(1), .pac-table td:nth-child(1),
    .pac-table th:nth-child(2), .pac-table td:nth-child(2) {
        text-align: left;
    }

    .pac-table th {
      background-color: var(--steel-gray);
      font-size: 12px; /* Fonte levemente menor para caber tudo */
      font-weight: 600;
      color: var(--navy-blue);
      text-transform: uppercase;
      vertical-align: middle;
    }
    .pac-table td {
      font-size: 13px;
      font-family: "Courier New", Courier, monospace;
      white-space: nowrap; /* Evita quebra de linha nos valores */
    }
    
    /* Fontes normais para Programa e Ação */
    .pac-table td:nth-child(1), .pac-table td:nth-child(2) {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      white-space: normal; /* Permite quebra de linha no nome da ação */
    }

    .pac-table tr:last-child {
      border-bottom: none;
    }
    
    /* Linhas de Agrupamento */
    .row-programa {
      background-color: #DDEBF7;
      font-weight: bold;
      color: var(--navy-blue);
    }
    .row-total {
      background-color: #002060;
      color: white;
      font-weight: bold;
      font-size: 14px;
    }
    .row-acao td:nth-child(2) {
        padding-left: 20px; /* Indentação visual da Ação */
        color: #555;
    }
    
    /* Estilo para o container do gráfico */
    .chart-container {
      position: relative;
      height: 400px; /* Altura ajustada */
      width: 100%;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">← Voltar para a Página Inicial</a>
  <main class="card" style="max-width: 1300px;"> <header class="card-header">
      <img src="logo-marinha.png" alt="Logotipo da Marinha do Brasil" class="logo" />
      <h1>Dashboard de Execução do PAC</h1>
    </header>

    <div class="chart-container">
      <canvas id="pacChart"></canvas>
    </div>
    
    <p class="hint" style="text-align: center; margin-top: -40px; margin-bottom: 24px;">
      Clique em um ano no gráfico acima para ver a tabela detalhada de execução.
    </p>

    <div class="row" style="align-items: flex-end; gap: 10px;">
        <div>
          <label for="ano">Selecione o Ano</label>
          <input id="ano" type="number" value="2025" min="2010" max="2030" />
        </div>
        
        <div class="actions" style="margin: 0;">
          <button id="btnConsultarPAC">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            Consultar SIOP
          </button>
        </div>
    </div>
    
    <p id="loading-text" class="hint" style="display: none; font-style: italic; margin-top: 10px;">Consultando SIOP, isso pode levar alguns segundos...</p>

    <div id="table-container" class="table-container" style="display: none;">
        <table id="tabelaPac" class="pac-table">
            <thead>
                <tr>
                    <th style="width: 10%;">PROGRAMA</th>
                    <th style="width: 25%;">AÇÃO</th>
                    <th>DOTAÇÃO ATUAL</th>
                    <th>PROV. (P)</th>
                    <th>DESTAQUE (D)</th>
                    <th>P + D</th>
                    <th>EMPENHADO</th>
                    <th>PAGO</th>
                    <th>% EXEC (P+D)</th>
                </tr>
            </thead>
            <tbody id="table-body">
                </tbody>
        </table>
    </div>
    
    <p id="pacStatus" class="hint" style="margin-top: 10px;"></p>
    <div id="error-text" class="preview" style="display: none; white-space: pre-wrap; color: red;"></div>

  </main>

  <script src="pac.js"></script>
</body>
</html>
